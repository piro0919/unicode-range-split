name: Publish

# タグを打ったときだけ公開する。package.json の version と揃っていることを先に確かめる。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: タグと version が一致するか
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build:lib
      # Trusted Publishing は npm 11.5.1 以上が要る。Node 22.23.2 に付いてくるのは
      # 10.9.8 なので、publish の前に入れ替える。
      - run: npm install -g npm@latest
      # トークンは持たない。npmjs.com 側にこのリポジトリとワークフロー名を登録してあり、
      # 認証は id-token で通る。provenance はそのとき既定で付くので指定しない。
      - run: npm publish --access public
